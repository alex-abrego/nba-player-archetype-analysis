[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "nba-player-archetype-analysis"
version = "0.1.0"
description = "NBA playing style, similarity, and archetype analysis"
requires-python = ">=3.12"

dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "plotly",
    "nba_api",
    "duckdb",
    "pyarrow",
    "jupyter",
    "ipykernel"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pip-tools",
    "build"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"